[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-doc-search"
version = "0.1.0"
description = "Hybrid document search with citations for industrial instrument manuals"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0.0"]
llm = ["openai>=1.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
industrial-doc-search = "industrial_doc_search.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
